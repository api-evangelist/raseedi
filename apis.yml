aid: raseedi
name: Raseedi
description: >-
  Raseedi is an Egyptian financial technology platform that helps underbanked
  users manage their spending and save money. Through its mobile app it offers
  free and discounted calls, mobile top-ups and bill payments, cash loans, and a
  smart dialer, building a community for financial control and savings. Surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network,
  Raseedi runs a Wix-hosted marketing site with no first-party developer API;
  its only machine-readable surface is a published llms.txt and the generic Wix
  Site MCP endpoint.
